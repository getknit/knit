# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# Local/default profile — full worker parallelism. Kotlin compiles IN-PROCESS (see the strategy setting
# below), not via a persistent standalone Kotlin daemon. CI (a 1 vCPU / 2 GB runner) overrides the heap/GC
# and serializes workers via $GRADLE_USER_HOME/gradle.properties — see .gitlab-ci.yml. Note: do NOT add a
# tight -XX:MaxMetaspaceSize here; AGP 9 / KSP / Compose load enough classes that a low cap starves
# Metaspace and crashes the daemon (bit us on the CI runner at 384m). In-process Kotlin now shares this
# daemon heap, so if compilation gets Metaspace/heap-tight, raise -Xmx rather than capping Metaspace.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Run the Kotlin compiler INSIDE the Gradle daemon instead of a separate, shared Kotlin daemon. This repo
# lives in many git worktrees that all share one ~/.gradle, so a shared out-of-process Kotlin daemon gets
# wedged into "Daemon compilation failed" states when two worktrees — or Android Studio and a CLI/stop-hook
# build — compile at the same time. In-process keeps each build's Kotlin compilation isolated to its own
# Gradle daemon (CI already runs in-process for memory reasons). Trades a little cold-build speed for that
# isolation; if it ever regresses iterative-build speed materially, reconsider per-worktree GRADLE_USER_HOME.
kotlin.compiler.execution.strategy=in-process
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Compose Preview Screenshot Testing (com.android.compose.screenshot, alpha): enables the `screenshotTest`
# source set; app/build.gradle.kts sets the same experimental property. See .agents/context/testing.md.
android.experimental.enableScreenshotTest=true
# App version. knit.versionName is the single source of truth: app/build.gradle.kts derives the versionCode from it
# (major·10⁷ + minor·10⁵ + patch·10³ + stage·10² + n, stage alpha 0 / beta 1 / rc 2 / stable 9, ADR 2026-11.7t9z),
# so a hotfix of the shipped line always sorts below the next line's pre-releases on Play. knit.versionCode stays
# here because fdroiddata's UpdateCheckData reads it from this file; the build refuses a value that disagrees. Bump
# the name, then run `python3 scripts/version-code.py --write`.
# KEEP THE GIT TAG EQUAL TO `v<versionName>`. fdroiddata expands `%v` to the *versionName* in both the
# `Binaries:` URL and `AutoUpdateMode: Version v%v`, so the v2.1 / tag-v2.1.0 mismatch we shipped at 2.1.0
# would have broken F-Droid's binary lookup and update check. Three-component versionName from here on.
# A semver pre-release suffix (`2.3.0-alpha.0`, `-beta.N`, `-rc.N`) makes the tag a sideload-only test
# build: same distribution key, but release.yml publishes it as a GitHub pre-release and refuses to let it
# reach fdroiddata. See .agents/context/distribution.md.
knit.versionCode=21100004
knit.versionName=2.11.0-alpha.4
# 2.11.0-alpha.4 ships four experiments: offline translation (ADR 2026-10.t2h6), the commons (ADR 2026-09.wx8e),
# direct links (ADR 2026-10.a5yj) and speech, which is walkie transcripts, live captions and voice-note transcripts
# (ADR 2026-10.nz3g, 2026-10.am8d). Set here, not on the command line, so release.yml's signed build, its
# F-Droid-image rebuild and the Play bundle all read the same flags. Removed again right after the tag.
translate=true
commons=true
directLinks=true
stt=true
