# NOTE: the field ids below are a contract with the app. Knit's "Report on GitHub" (a stored crash) and
# About's "Report a problem" build prefilled URLs from them
# (app/src/main/java/app/getknit/knit/crash/CrashIssueUrl.kt); renaming or removing one silently stops
# that prefill working. CrashIssueUrlTest reads this file and fails if a prefilled key is missing here.
name: 🐛 Bug report
description: Report a defect in Knit, the offline Android mesh messenger.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. **Please search existing issues before opening a new one.**

        - Knit is a **best-effort project shipped as-is** — issues are welcome but may not be
          triaged, answered, or fixed on any timeline (see `CONTRIBUTING.md`).
        - **Do not report security vulnerabilities here.** See `SECURITY.md` for private disclosure —
          public disclosure before a fix exists puts users at risk.

        ### Attach what Knit recorded

        Knit keeps two records on your phone that make a report far easier to act on. Find both in the
        chat list's **⋮ menu › Diagnostics**, under **Reports and logs**, and attach them in **Logs /
        screenshots** below:

        - **Last crash** — if Knit closed unexpectedly, or froze until Android closed it, open Knit again
          and look for this row. Tap **Report on GitHub** to open this form already filled in, or **Share
          as a file** and attach that file. Knit removed ids, names and message text before showing it to
          you. No row means nothing could be captured; describe what you were doing instead.
        - **Field log** — for phones not finding each other, links dropping, or messages, files or calls
          arriving late or not at all. It records only while it's on, so turn on **Keep a field log**,
          make the problem happen again, then tap **Share as a file**. One from each phone involved helps
          most. It holds no names, messages, contacts, phone ids or locations. Older versions save it as
          `.jsonl`, which GitHub won't take: rename it to end in `.txt`, or zip it.

        GitHub issues are public: anyone can read what you attach, so read it over first.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order? Real mesh behavior usually needs two or more physical devices.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Actual behavior, including any error text or logcat output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Knit version / commit
      description: >-
        The app version, or the commit SHA you built from. Filled in for you when you report from
        Knit's About screen.
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Devices and Android version
      description: Every device involved, with its Android version and API level (e.g. "Pixel 6, Android 14 / API 34").
    validations:
      required: true
  - type: dropdown
    id: radios
    attributes:
      label: Radios involved
      description: Which transport(s) were in use? Knit runs Wi-Fi Aware and Bluetooth LE simultaneously.
      options:
        - Not sure
        - Wi-Fi Aware (NAN)
        - Bluetooth LE
        - Both
    validations:
      required: true
  - type: input
    id: mesh-size
    attributes:
      label: Number of devices in the mesh
      placeholder: "2"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Drag files in here, or paste text. Most useful, from **⋮ menu › Diagnostics**: the **Last crash**
        report (**Share as a file**), and a **Field log** from each phone involved, recorded while the
        problem happened (**Share as a file**; rename an older version's `.jsonl` to `.txt`, which GitHub
        accepts). Screenshots help too. Anyone can read what you attach here, so read it over first.

        With a computer: `adb logcat` excerpts, or a mesh-state dump. Debug builds expose a headless
        bridge — e.g.
        `adb shell am broadcast -a app.getknit.knit.debug.STATE -p app.getknit.knit`
        dumps self id, transport health, and reachable peers (see `.agents/context/debug-bridge.md`).
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md privately).
          required: true
        - label: I understand Knit is a best-effort project with no support guarantee.
          required: true
