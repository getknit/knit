name: DCO

# Enforces the sign-off that CONTRIBUTING.md and the pull-request template already ask for: every
# non-merge commit in a pull request must carry a `Signed-off-by:` trailer matching its author,
# certifying the Developer Certificate of Origin (the verbatim text is in ./DCO at the repo root).
#
# Its own workflow rather than a job in ci.yml, for three reasons: ci.yml's header scopes that file
# to mirroring the gating jobs of the maintainer's internal .gitlab-ci.yml and this check has no
# GitLab counterpart; this is a seconds-long metadata check that should not queue behind the JDK,
# the Android SDK and Gradle; and it wants its own concurrency group so a rapid re-push does not
# cancel a running suite.
#
# `pull_request`, not `pull_request_target`. The check only reads commit metadata through the API,
# needs no secret and no checkout, so the trigger that cannot hand a fork's code a token is the
# right one. That also means the SHA-pinning rule triage.yml documents would permit `@v9` here; the
# SHA is reused anyway so the tree carries exactly one version of github-script.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // paginate: a pull request can carry more commits than one page returns, and a missed
            // page would silently pass a commit nobody checked.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            // A trailer is only a trailer at the start of a line. Matching mid-line would let
            // "we should add Signed-off-by: ..." in a prose body satisfy the check.
            const SIGNOFF = /^\s*Signed-off-by:\s*(.+?)\s*<([^>]+)>\s*$/gim;

            const failures = [];
            for (const c of commits) {
              // Merge commits are generated by GitHub when a contributor clicks "Update branch";
              // the contributor never authors them and cannot sign them.
              if ((c.parents || []).length > 1) continue;

              const message = c.commit.message || '';
              const signoffs = [...message.matchAll(SIGNOFF)].map((m) => m[2].toLowerCase());

              // Author or committer: a rebase, a cherry-pick, or a suggestion applied through the
              // web UI leaves those two different, and either one signing is a valid certification.
              const author = (c.commit.author?.email || '').toLowerCase();
              const committer = (c.commit.committer?.email || '').toLowerCase();

              if (signoffs.length === 0) {
                failures.push(`${c.sha.slice(0, 7)}  no Signed-off-by trailer  (${author})`);
              } else if (!signoffs.includes(author) && !signoffs.includes(committer)) {
                failures.push(
                  `${c.sha.slice(0, 7)}  signed off by ${signoffs.join(', ')} ` +
                    `but authored by ${author}`,
                );
              }
            }

            const checked = commits.filter((c) => (c.parents || []).length <= 1).length;
            if (failures.length === 0) {
              core.info(`all ${checked} commit(s) signed off`);
              return;
            }

            // Every offender in one failure. Reporting only the first turns a five-commit branch
            // into five push-and-wait rounds.
            core.setFailed(
              [
                `${failures.length} of ${checked} commit(s) are not signed off:`,
                '',
                ...failures.map((f) => `  ${f}`),
                '',
                'Add a Signed-off-by trailer certifying the Developer Certificate of Origin',
                '(see ./DCO and CONTRIBUTING.md). The email must match the commit author.',
                '',
                '  one commit:   git commit --amend -s && git push --force-with-lease',
                '  several:      git rebase --signoff origin/main && git push --force-with-lease',
                '',
                'Use `git commit -s` from the start and this never comes up again.',
              ].join('\n'),
            );
