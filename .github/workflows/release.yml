name: Release

# Builds, signs, verifies and publishes the distribution APK for a v* tag — the exact file F-Droid
# fetches via `Binaries:` and byte-compares against its own rebuild. Background and the reproducibility
# contract: .agents/context/distribution.md.
#
# Two kinds of tag, told apart by the versionName alone:
#
#   v2.2.3          stable  -> DRAFT Release, F-Droid's `Binaries:` target, fdroiddata must agree
#   v2.4.0-alpha.0  test    -> PUBLISHED pre-release, sideload only, fdroiddata must NOT mention it
#
# Both are signed with the same distribution key and pass the same reproducibility gate, so a pre-release
# installs in place over an F-Droid / GitHub / mesh-shared install. They differ only in their relationship
# to fdroiddata, and `preflight` enforces that relationship in both directions — including the regex on
# `UpdateCheckMode`, which is the only thing stopping F-Droid's checkupdates bot from picking a tagged
# alpha up on its own and shipping it as a stable release.
#
# IMPORTANT: for tag pushes GitHub runs the copy of this file that exists AT THE TAG. Editing this
# workflow only affects tags cut afterwards; to apply a change to an existing unpushed tag, move the tag.
#
# ACTION PINS: majors chosen so every JS action runs on Node 24. gradle/actions stays at v5 on purpose —
# v6's caching lives in the proprietary `gradle-actions-caching` component (Gradle Terms of Use, not MIT).
# setup-android gets an explicit `packages:` for the reason ci.yml's banner gives (its default
# names the `tools` package, which Google no longer serves). See ci.yml.
#
# Three jobs, split by who holds the signing key:
#
#   build-signed  ubuntu runner, HAS the distribution key   -> the APK we publish
#   build-fdroid  F-Droid's own buildserver image, NO secrets -> the same APK, unsigned
#   publish       proves those two are one APK modulo the signature, then cuts the Release
#
# A stable tag also ships the slim APK (knit-X.Y.Z-slim.apk, `-Pslim=true`): the core radio messenger without
# relays, calls, speech or Knit Anywhere, for people who want only that. Same key and versionCode, so it swaps in
# place with the full APK either way. It passes the same gates, through its own build-fdroid matrix leg. F-Droid
# never sees it: `Binaries:` names the full APK only.
#
# The point of build-fdroid is that a GitHub runner is a *third* build environment. Reproducibility was
# only ever proven between the maintainer's machine and F-Droid's container; nothing says a runner agrees
# with either. Rather than find out when F-Droid's verification fails — after the tag and Release are
# public and the fix costs a re-tag — the divergence is caught here and nothing gets published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-finished release

env:
  APK_DIR: app/build/outputs/apk/release
  # apksigner lives in build-tools. The same revision app/build.gradle.kts pins as `buildToolsVersion`,
  # so the F-Droid job below builds with the package it installs; the other jobs only inspect the APK.
  BUILD_TOOLS: 37.0.0

jobs:
  preflight:
    name: Preflight (metadata invariants)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      version_code: ${{ steps.check.outputs.version_code }}
      apk_name: ${{ steps.check.outputs.apk_name }}
      slim_apk_name: ${{ steps.check.outputs.slim_apk_name }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      variants: ${{ steps.check.outputs.variants }}
    steps:
      - uses: actions/checkout@v7
      # Explicit, so `pip install` targets a tool-cache Python rather than the runner's system Python,
      # which is PEP 668 externally-managed and refuses plain installs.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Everything here is a contract that only breaks at publish time or, worse, silently in F-Droid's
      # queue weeks later. All of it is cheap, so fail before spending two builds on a doomed tag.
      - id: check
        name: Tag, gradle.properties and .fdroid.yml must agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re, sys, yaml

          tag = os.environ["TAG"]
          props = dict(
              re.match(r"([^=]+)=(.*)", line).groups()
              for line in pathlib.Path("gradle.properties").read_text().splitlines()
              if "=" in line and not line.lstrip().startswith("#")
          )
          version = props["knit.versionName"]
          code = int(props["knit.versionCode"])
          meta = yaml.safe_load(pathlib.Path(".fdroid.yml").read_text())
          errs = []

          # The versionName alone decides which kind of release this is. A semver pre-release suffix
          # (2.4.0-alpha.0 / -beta.1 / -rc.2) means a sideload-only test build; anything else is a stable
          # release F-Droid will distribute. Everything below that differs between the two follows from
          # this one bit, so an unparseable versionName is a hard error rather than a silent "stable".
          stable = re.fullmatch(r"\d+(\.\d+)*", version)
          prerelease = re.fullmatch(r"\d+(\.\d+)*-(alpha|beta|rc)\.\d+", version)
          if not stable and not prerelease:
              errs.append(
                  f"knit.versionName {version!r} is neither X.Y[.Z] nor X.Y.Z-(alpha|beta|rc).N — "
                  "refusing to guess whether this tag is a stable release or a test build"
              )

          # `%v` in Binaries:/AutoUpdateMode expands to versionName, so the tag MUST be v<versionName>.
          # A 2.1 / v2.1.0 style mismatch silently breaks both the download URL and update detection.
          if tag != f"v{version}":
              errs.append(f"tag {tag} != v{version} (knit.versionName in gradle.properties)")

          # `fdroid checkupdates` walks this repo's TAGS, so every tag is visible to F-Droid's bot whether
          # or not fdroiddata mentions it. The regex on UpdateCheckMode is the only thing standing between
          # a pre-release tag and an auto-generated fdroiddata build entry that ships it to every F-Droid
          # user as a stable release. Parsed and applied exactly as fdroidserver's check_tags() does —
          # `pattern = mode[5:] if len(mode) > 4 else None`, then `re.compile(pattern).match(tag)` against
          # the raw tag name — so this check cannot disagree with the real one.
          ucm = str(meta.get("UpdateCheckMode", ""))
          pattern = (ucm[5:] if len(ucm) > 4 else None) if ucm.startswith("Tags") else None
          pattern = pattern or None
          if prerelease:
              if pattern is None:
                  errs.append(
                      "UpdateCheckMode has no tag filter, so `fdroid checkupdates` would pick this "
                      f"pre-release tag up and ship {version} as a stable F-Droid release — set e.g. "
                      "`UpdateCheckMode: Tags ^v[0-9.]+$` (and mirror it to fdroiddata) first"
                  )
              elif re.compile(pattern).match(tag):
                  errs.append(
                      f"UpdateCheckMode filter {pattern!r} MATCHES {tag}: F-Droid's bot would ship this "
                      "pre-release to every F-Droid user"
                  )
          elif pattern is not None and not re.compile(pattern).match(tag):
              # The mirror image, and just as damaging: an over-tight filter silently freezes F-Droid on
              # the previous version, with no error anywhere.
              errs.append(
                  f"UpdateCheckMode filter {pattern!r} does not match {tag}: F-Droid's bot would never "
                  "see this release"
              )

          if prerelease:
              # Nothing in fdroiddata may name a pre-release. These are the point-for-point mirror of the
              # stable checks below: all of them passing means the version is invisible to F-Droid by
              # construction, not by our remembering to leave it out.
              if meta.get("CurrentVersion") == version or meta.get("CurrentVersionCode") == code:
                  errs.append(
                      f".fdroid.yml Current* names the pre-release {version} ({code}) — a test build must "
                      "never become F-Droid's recommended release"
                  )
              if any(
                  b.get("versionCode") == code or b.get("versionName") == version
                  for b in meta.get("Builds", [])
              ):
                  errs.append(f".fdroid.yml has a Builds entry for the pre-release {version} ({code})")

              # A test build that cannot install over the shipped stable is useless to the tester: Android
              # refuses a versionCode downgrade, so the alpha has to sit above whatever F-Droid ships.
              current_code = meta.get("CurrentVersionCode")
              if isinstance(current_code, int) and code <= current_code:
                  errs.append(
                      f"knit.versionCode {code} <= the shipped stable's {current_code}: testers could not "
                      "install this build over their current one"
                  )
          else:
              # F-Droid scrapes fastlane/ from this repo at the built commit; a missing changelog means the
              # listing ships with no release notes at all. (Pre-releases may have one, but need not — they
              # never reach the listing, and the Release notes fall back to CHANGELOG.md's Unreleased.)
              changelog = pathlib.Path(f"fastlane/metadata/android/en-US/changelogs/{code}.txt")
              if not changelog.is_file():
                  errs.append(f"missing {changelog}")

              if meta.get("CurrentVersion") != version:
                  errs.append(f".fdroid.yml CurrentVersion {meta.get('CurrentVersion')!r} != {version!r}")
              if meta.get("CurrentVersionCode") != code:
                  errs.append(f".fdroid.yml CurrentVersionCode {meta.get('CurrentVersionCode')!r} != {code}")

              builds = [b for b in meta.get("Builds", []) if b.get("versionCode") == code]
              if not builds:
                  errs.append(f".fdroid.yml has no Builds entry for versionCode {code}")
              else:
                  b = builds[0]
                  if b.get("versionName") != version:
                      errs.append(f".fdroid.yml Builds versionName {b.get('versionName')!r} != {version!r}")
                  # F-Droid builds whatever `commit:` names — if it isn't this tag they verify a different
                  # tree. (The full-hash pin linsui asked for lands in the follow-up commit, which cannot
                  # exist yet at the tag; see .agents/context/distribution.md.)
                  if b.get("commit") != tag:
                      errs.append(f".fdroid.yml Builds commit {b.get('commit')!r} != {tag!r}")

          # Both kinds of tag are signed with the distribution key, so this pin matters either way — a
          # pre-release signed with anything else could not install over a real Knit install at all.
          key = meta.get("AllowedAPKSigningKeys")
          if not key or not re.fullmatch(r"[0-9a-f]{64}", str(key)):
              errs.append(f".fdroid.yml AllowedAPKSigningKeys is not a lowercase sha256: {key!r}")

          # Derive the asset filename FROM the Binaries: URL rather than hardcoding it, so the published
          # asset and the URL F-Droid fetches cannot drift apart. Pre-releases reuse the same template
          # (knit-2.4.0-alpha.0.apk) purely so every Knit APK is named the same way; the URL assertion is
          # stable-only, since no Binaries: URL will ever point at a test build.
          url = str(meta.get("Binaries", "")).replace("%v", version)
          if not prerelease and f"/releases/download/{tag}/" not in url:
              errs.append(f"Binaries: URL does not point at {tag}: {url}")
          apk_name = url.rsplit("/", 1)[-1]
          if not apk_name.endswith(".apk"):
              errs.append(f"Binaries: URL does not name an .apk: {url}")
          # The slim APK rides beside the full one on a stable Release only; F-Droid never fetches it.
          slim_apk_name = apk_name.removesuffix(".apk") + "-slim.apk"

          if errs:
              for e in errs:
                  print(f"::error::{e}", file=sys.stderr)
              sys.exit(1)

          kind = "pre-release" if prerelease else "release"
          print(f"version={version}")
          print(f"version_code={code}")
          print(f"apk_name={apk_name}")
          print(f"slim_apk_name={slim_apk_name}")
          print(f"prerelease={'true' if prerelease else 'false'}")
          print("variants=" + json.dumps(["full"] if prerelease else ["full", "slim"]))
          print(f"OK: {kind} {tag} -> {apk_name} (versionCode {code})", file=sys.stderr)
          PY

  build-signed:
    name: Build signed APK
    needs: preflight
    runs-on: ubuntu-latest
    # Declaring an environment lets you attach protection rules (required reviewers, tag-only deployment
    # branches) to the ONE job that can touch the distribution key. Repo-level secrets resolve here either
    # way, so this costs nothing if you never configure the environment.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools # NOT the default `tools platform-tools` — see ACTION PINS above
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode distribution keystore
        env:
          KEYSTORE_B64: ${{ secrets.KNIT_DIST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::secret KNIT_DIST_KEYSTORE_B64 is unset or empty"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/knit-dist.jks"

      # Each build is copied out before the next one overwrites app-release.apk and its mapping.
      - name: assembleRelease
        env:
          KNIT_SIGNING_STORE_FILE: ${{ runner.temp }}/knit-dist.jks
          KNIT_SIGNING_STORE_PASSWORD: ${{ secrets.KNIT_DIST_STORE_PASSWORD }}
          KNIT_SIGNING_KEY_ALIAS: ${{ secrets.KNIT_DIST_KEY_ALIAS }}
          KNIT_SIGNING_KEY_PASSWORD: ${{ secrets.KNIT_DIST_KEY_PASSWORD }}
          VERSION: ${{ needs.preflight.outputs.version }}
          APK: ${{ needs.preflight.outputs.apk_name }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --console=plain --stacktrace
          [ -f "$APK_DIR/app-release.apk" ] \
            || { echo "::error::$APK_DIR/app-release.apk not produced — did signing credentials resolve?"; exit 1; }
          # A platform class R8 renamed breaks the first vector drawable at runtime (GitHub #59); android.jar is
          # the compile SDK the build above installed under $ANDROID_HOME.
          scripts/r8-platform-gate.sh app/build/outputs/mapping/release/mapping.txt
          mkdir -p out
          cp "$APK_DIR/app-release.apk" "out/$APK"
          # R8 obfuscates, so this is the only way to symbolicate a crash from this build. Keep it forever.
          # ~63 MB raw and highly compressible, so ship it gzipped rather than doubling the release size.
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "out/mapping-$VERSION.txt.gz"

      # The slim APK, stable tags only. Its versionName carries `-slim`, so a crash report from it names
      # mapping-<version>-slim.txt.gz (crash/CrashStore.kt builds the name from the versionName).
      - name: assembleRelease (slim)
        if: needs.preflight.outputs.prerelease != 'true'
        env:
          KNIT_SIGNING_STORE_FILE: ${{ runner.temp }}/knit-dist.jks
          KNIT_SIGNING_STORE_PASSWORD: ${{ secrets.KNIT_DIST_STORE_PASSWORD }}
          KNIT_SIGNING_KEY_ALIAS: ${{ secrets.KNIT_DIST_KEY_ALIAS }}
          KNIT_SIGNING_KEY_PASSWORD: ${{ secrets.KNIT_DIST_KEY_PASSWORD }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SLIM_APK: ${{ needs.preflight.outputs.slim_apk_name }}
        run: |
          set -euo pipefail
          rm -f "$APK_DIR/app-release.apk" app/build/outputs/mapping/release/mapping.txt
          ./gradlew :app:assembleRelease -Pslim=true --console=plain --stacktrace
          [ -f "$APK_DIR/app-release.apk" ] || { echo "::error::slim $APK_DIR/app-release.apk not produced"; exit 1; }
          scripts/r8-platform-gate.sh app/build/outputs/mapping/release/mapping.txt
          cp "$APK_DIR/app-release.apk" "out/$SLIM_APK"
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "out/mapping-$VERSION-slim.txt.gz"

      - name: Destroy keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/knit-dist.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/knit-dist.jks"

      - name: Verify the APKs before anyone can download them
        env:
          APK: ${{ needs.preflight.outputs.apk_name }}
          SLIM_APK: ${{ needs.preflight.outputs.slim_apk_name }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          # printf over a glob, not `ls` (SC2012). `tail -1` drains its input, so no SIGPIPE here.
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          [ -x "$apksigner" ] \
            || { echo "::error::no apksigner under $ANDROID_HOME/build-tools"; exit 1; }
          expected=$(sed -n 's/^AllowedAPKSigningKeys:[[:space:]]*//p' .fdroid.yml)

          apks=("out/$APK")
          [ "$PRERELEASE" = true ] || apks+=("out/$SLIM_APK")
          for apk in "${apks[@]}"; do
            [ -f "$apk" ] || { echo "::error::$apk missing"; exit 1; }
            # Read each source ONCE into a variable, then match in-shell. Deliberately no `cmd | grep -q`
            # below: grep -q exits at its first match, SIGPIPEs the writer, and under `set -o pipefail` that
            # surfaces as a FAILED check — nondeterministically, depending on whether the writer had already
            # finished. Measured here: identical checks returning 0 and 141 on consecutive ABIs.
            entries=$(unzip -Z1 "$apk")
            certs=$("$apksigner" verify --print-certs "$apk") \
              || { echo "::error::apksigner could not verify $apk"; exit 1; }

            # 1. Signed with the key fdroiddata pins. AllowedAPKSigningKeys is a permanent public commitment;
            #    an APK signed with anything else (say the Play upload key) cannot be distributed or update
            #    an existing install, and the mistake is only visible here. The slim APK carries the same key
            #    so it swaps in place with the full one.
            actual=$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' <<<"$certs")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk signed with ${actual:-<no certificate>} but AllowedAPKSigningKeys pins $expected"
              exit 1
            fi

            # 2. No VCS stamp. This is the exact entry that broke cross-environment reproducibility once
            #    (buildTypes.release { vcsInfo { include = false } }); AGP would re-add it if that regressed.
            case $entries in
              *META-INF/version-control-info.textproto*)
                echo "::error::$apk contains META-INF/version-control-info.textproto — vcsInfo re-enabled?"
                exit 1 ;;
            esac

            # 3. Universal APK, all four ABIs. An accidental split would leave most users unable to install
            #    the single file F-Droid distributes.
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              case $entries in
                *"lib/$abi/"*) ;;
                *) echo "::error::no lib/$abi/ in $apk — is this still a universal build?"; exit 1 ;;
              esac
            done
            echo "$apk: signed with AllowedAPKSigningKeys ($actual), universal, no VCS stamp: OK"
          done

          # 4. The slim APK really is slim: no WebRTC, the one library only calls package. A flag that stopped
          #    reaching the release build would otherwise ship a full APK under the slim name.
          if [ "$PRERELEASE" != true ]; then
            slim_entries=$(unzip -Z1 "out/$SLIM_APK")
            case $slim_entries in
              *libjingle_peerconnection_so.so*)
                echo "::error::$SLIM_APK packages WebRTC — did -Pslim=true stop turning calls off?"; exit 1 ;;
            esac
            echo "$SLIM_APK: $(stat -c %s "out/$SLIM_APK") bytes vs $(stat -c %s "out/$APK") for the full APK"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: signed-release
          path: out/
          if-no-files-found: error
          retention-days: 7

  build-fdroid:
    name: Reproduce unsigned on F-Droid's buildserver (${{ matrix.variant }})
    needs: preflight
    runs-on: ubuntu-latest
    # One cold leg per published APK: full always, slim on a stable tag (preflight's `variants`).
    strategy:
      fail-fast: true
      matrix:
        variant: ${{ fromJSON(needs.preflight.outputs.variants) }}
    # F-Droid's actual build image, so this job answers the only question that matters: will their
    # rebuild of this tag match the bytes we publish? Deliberately has no access to signing secrets.
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - uses: actions/checkout@v7
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Must track app/build.gradle.kts's compileSdk and buildToolsVersion, and both packages must exist
      # in f-droid/android-sdk-transparency-log — this image's sdkmanager is F-Droid's, and resolves
      # against that log rather than Google's repository (37.1 failed here in 2026-08 for exactly that
      # reason). Output is NOT discarded: sdkmanager reports an unknown package as a `Warning:` line and
      # exits non-zero, so redirecting it leaves a bare "exit code 1".
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37.1" "build-tools;$BUILD_TOOLS"

      # No Gradle cache here on purpose. A cached task output could satisfy this build from work done on
      # the *other* runner, which is precisely the divergence this job exists to detect. It has to be cold.
      #
      # No signing credentials -> android.signingConfigs creates no release config -> unsigned output.
      # That is byte-for-byte what F-Droid's own buildserver produces from this commit.
      #
      # Uses ./gradlew rather than the image's gradlew-fdroid shim (which is what fdroidserver itself runs
      # after deleting the wrapper). Byte-equivalent: both read gradle/wrapper/gradle-wrapper.properties
      # for the version, so both land on the same Gradle, and the packaged bytes depend on the Gradle/JDK/
      # SDK versions, not the launcher. Verified in this image: Gradle 9.5.0 on its Debian JDK 21, with the
      # daemon JVM resolved from gradle/gradle-daemon-jvm.properties and no foojay download.
      - name: assembleRelease (unsigned)
        env:
          VARIANT: ${{ matrix.variant }}
        # A container step defaults to `sh -e`, which is dash in this image: no arrays, no pipefail.
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [ "$VARIANT" = slim ]; then flags+=(-Pslim=true); fi
          ./gradlew :app:assembleRelease "${flags[@]}" --console=plain --stacktrace --no-build-cache

      - uses: actions/upload-artifact@v7
        with:
          name: fdroid-unsigned-${{ matrix.variant }}
          path: ${{ env.APK_DIR }}/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify reproducible & publish Release
    needs: [preflight, build-signed, build-fdroid]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: build-tools;${{ env.BUILD_TOOLS }} # apksigcopier shells out to apksigner
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v8
        with: { name: signed-release, path: signed }
      # One directory per leg: unsigned/fdroid-unsigned-full/, unsigned/fdroid-unsigned-slim/. By name, not a
      # `fdroid-unsigned-*` pattern: a pattern matching one artifact (a pre-release builds no slim leg)
      # extracts it straight into `path`, with no per-artifact directory.
      - uses: actions/download-artifact@v8
        with: { name: fdroid-unsigned-full, path: unsigned/fdroid-unsigned-full }
      - if: needs.preflight.outputs.prerelease != 'true'
        uses: actions/download-artifact@v8
        with: { name: fdroid-unsigned-slim, path: unsigned/fdroid-unsigned-slim }

      # THE gate. apksigcopier is the same tool fdroidserver's `fdroid verify` uses: it grafts the
      # signature off our APK onto F-Droid's unsigned rebuild and checks the result still verifies —
      # which it only can if every other byte is identical. Passing here means F-Droid's verification
      # of this release will pass too.
      - name: Signed APKs must be F-Droid's rebuilds plus a signature
        env:
          APK: ${{ needs.preflight.outputs.apk_name }}
          SLIM_APK: ${{ needs.preflight.outputs.slim_apk_name }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          pip install --quiet apksigcopier
          # Assign then export, so a failed substitution isn't masked by export's exit status (SC2155).
          build_tools=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          [ -x "$build_tools/apksigner" ] \
            || { echo "::error::no apksigner under $ANDROID_HOME/build-tools"; exit 1; }
          export PATH="$build_tools:$PATH"
          apksigcopier compare "signed/$APK" unsigned/fdroid-unsigned-full/app-release-unsigned.apk --unsigned
          echo "reproducible: $APK is F-Droid's build, signed"
          if [ "$PRERELEASE" != true ]; then
            apksigcopier compare "signed/$SLIM_APK" unsigned/fdroid-unsigned-slim/app-release-unsigned.apk --unsigned
            echo "reproducible: $SLIM_APK is the F-Droid image's -Pslim=true build, signed"
          fi

      - name: Compose release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
          APK: ${{ needs.preflight.outputs.apk_name }}
          SLIM_APK: ${{ needs.preflight.outputs.slim_apk_name }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd signed
          sha256sum "$APK" > "$APK.sha256"
          digest=$(cut -d' ' -f1 "$APK.sha256")
          if [ "$PRERELEASE" != true ]; then
            sha256sum "$SLIM_APK" > "$SLIM_APK.sha256"
            slim_digest=$(cut -d' ' -f1 "$SLIM_APK.sha256")
            full_mb=$(( $(stat -c %s "$APK") / 1048576 ))
            slim_mb=$(( $(stat -c %s "$SLIM_APK") / 1048576 ))
          fi
          cert=$(sed -n 's/^AllowedAPKSigningKeys:[[:space:]]*//p' ../.fdroid.yml)
          changelog="../fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"

          if [ -f "$changelog" ]; then
            # Always preferred, and for a stable release preflight already proved it exists.
            cat "$changelog" > body.md
          else
            # Pre-release with no per-versionCode changelog: fall back to CHANGELOG.md's Unreleased
            # section, which is exactly "what a tester gets that the last stable didn't". Read out of the
            # checkout rather than `git log`, so this needs no tag history and works on a shallow clone.
            awk '/^## /{ if (p) exit; if ($0 ~ /^## Unreleased/) { p = 1; next } } p' ../CHANGELOG.md > body.md
            [ -s body.md ] || echo "Test build off \`$GITHUB_SHA\`. See CHANGELOG.md for details." > body.md
          fi

          {
            cat body.md
            echo
            echo "---"
            echo
            if [ "$PRERELEASE" = true ]; then
              cat <<EOF
          **Pre-release — a test build, not a shipping release.** It is not on F-Droid, is not marked
          *Latest*, and is not what F-Droid's \`Binaries:\` URL points at. Install it only if you mean to
          test it.

          **\`$APK\`** — \`sha256:$digest\`

          Signed with Knit's distribution key (certificate \`$cert\`) — the same key every off-Play Knit
          build carries — so it installs straight over an existing F-Droid, GitHub or mesh-shared install
          without an uninstall, and keeps your messages.

          Going *back* to the current stable is not possible in place: Android refuses the versionCode
          downgrade, so reverting costs an uninstall and everything stored on the device with it. The next
          stable release will update over this build normally.

          CI verified this APK is byte-identical, apart from the signature, to an independent unsigned
          rebuild produced inside F-Droid's own buildserver image — the same reproducibility gate stable
          releases pass.

          \`mapping-$VERSION.txt.gz\` is the R8 deobfuscation map for symbolicating crash reports from this build.
          EOF
            else
              cat <<EOF
          **\`$APK\`** — \`sha256:$digest\` — $full_mb MB

          **\`$SLIM_APK\`** — \`sha256:$slim_digest\` — $slim_mb MB

          The slim APK is Knit's offline messenger and nothing else: Wi-Fi Aware, Bluetooth and LoRa boards,
          without internet relays, link previews, calls, transcription or Knit Anywhere. It has the same key and
          version as the full APK, so either one installs over the other and keeps your messages. F-Droid only
          carries the full APK, and an F-Droid client on the same phone will offer it as the next update; to
          stay on the slim build, update from this page.

          Both are signed with Knit's distribution key (certificate \`$cert\`), the key pinned in F-Droid's
          \`AllowedAPKSigningKeys\`. CI verified each file is byte-identical, apart from the signature, to an
          independent unsigned rebuild produced inside F-Droid's own buildserver image — so F-Droid's
          rebuild-and-compare check resolves to exactly \`$APK\`.

          \`mapping-$VERSION.txt.gz\` and \`mapping-$VERSION-slim.txt.gz\` are the R8 deobfuscation maps for
          symbolicating crash reports from each build.
          EOF
            fi
          } > notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
          APK: ${{ needs.preflight.outputs.apk_name }}
          SLIM_APK: ${{ needs.preflight.outputs.slim_apk_name }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd signed
          assets=("$APK" "$APK.sha256" "mapping-$VERSION.txt.gz")
          if [ "$PRERELEASE" = true ]; then
            # Published, not drafted: nothing in fdroiddata points here, so there is no 404 window to
            # manage, and the whole point of a test build is that testers can fetch it the moment CI is
            # green. --prerelease (belt-and-braces with --latest=false) keeps it out of /releases/latest,
            # which is what the F-Droid listing and every "download Knit" link follow.
            flags=(--prerelease --latest=false --title "Knit $VERSION (pre-release)")
          else
            # Draft on purpose: publishing is the irreversible step. Everything above is already verified,
            # so this is a one-click confirmation that the notes read right — and the Binaries: URL stays
            # 404 until you click, which is the correct state while fdroiddata still points at the previous
            # version. Drop `--draft` if you'd rather it go straight out.
            flags=(--draft --title "Knit $VERSION")
            assets+=("$SLIM_APK" "$SLIM_APK.sha256" "mapping-$VERSION-slim.txt.gz")
          fi
          gh release create "$TAG" "${flags[@]}" --notes-file notes.md "${assets[@]}"
          if [ "$PRERELEASE" = true ]; then
            echo "::notice::Pre-release $TAG published — the sideload URL is live now. F-Droid is untouched."
          else
            echo "::notice::Draft release created for $TAG — review and publish it to make the Binaries: URL live."
          fi
