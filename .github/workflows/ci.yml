name: CI

# Public-mirror CI for github.com/getknit/knit. Mirrors the core jobs of the maintainer's internal
# .gitlab-ci.yml (build -> test -> verify) so pull requests opened on the GitHub mirror get automated
# checks. Builds here are UNSIGNED and never touch a signing key — cutting the signed release APK is
# release.yml's job, triggered by a v* tag. detekt/ktlint are advisory
# (continue-on-error), matching the GitLab pipeline's allow_failure posture; they are enforced locally
# by the repo's Git hooks. The *.tflite moderation models are ordinary Git blobs (NOT LFS — see
# .gitattributes and .agents/context/distribution.md), so a plain checkout is enough; the build's
# checkModerationModels task hard-fails if one ever arrives as a pointer stub.
#
# ACTION PINS: every JS action here is held at a major that runs on Node 24 — GitHub's runners force
# Node 20 actions onto 24 and warn about it, and the Node 20 runtime is going away. JetBrains/qodana-action
# is pinned to an exact patch rather than a major because the tag also selects the inspection ENGINE, and a
# silent engine bump changes the finding set; keep it in step with qodana.yaml's `linter:`. gradle/actions is
# deliberately kept at v5, the last MIT release: v6 moves caching into `gradle-actions-caching`, a
# proprietary component governed by Gradle's Terms of Use rather than the MIT licence, and it loads
# whenever caching is on (it is, by default). Don't "upgrade" that one.
#
# android-actions/setup-android is given an explicit `packages:` at every site, because its default
# is `tools platform-tools` and Google stopped serving the obsolete `tools` package on 2026-09-15 —
# sdkmanager then exits 1 and takes every job that uses the action with it
# (android-actions/setup-android#537). Name what the job actually needs; the default is not a
# fallback we can rely on again even if upstream fixes it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual trigger; the qodana job below runs only on this

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools # NOT the default `tools platform-tools` — see ACTION PINS above
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain
      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain
      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  mesh-lab:
    name: Mesh-in-a-box scenarios (x3)
    runs-on: ubuntu-latest
    # The multi-node JVM scenarios (app/src/test/.../mesh/lab/, see .agents/context/testing.md) already
    # ride build-test's testDebugUnitTest once. They get their own job because they are the one suite
    # where real time and thread scheduling decide the outcome — N complete mesh stacks converging on
    # Dispatchers.Default, polled — so a 1-in-N flake here is a bug, either in the lab or in the mesh
    # (the router overhear-suppression bug and the lost-parked-seed gap both surfaced as flakes). Three
    # consecutive green runs are the bar; `--rerun` forces the Test task past Gradle's up-to-date check.
    # Enforced, not advisory: the suite is deterministic on a 4 vCPU runner (48/48 locally).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools # NOT the default `tools platform-tools` — see ACTION PINS above
      - uses: gradle/actions/setup-gradle@v5
      - name: Run the mesh/lab scenarios three times
        run: |
          for run in 1 2 3; do
            echo "::group::mesh/lab run $run"
            ./gradlew :app:testDebugUnitTest --tests 'app.getknit.knit.mesh.lab.*' --rerun --stacktrace --console=plain
            echo "::endgroup::"
          done
      - name: Upload mesh/lab report (last run)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mesh-lab-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  mesh-lab-chaos:
    name: Mesh-in-a-box under seeded chaos (advisory)
    runs-on: ubuntu-latest
    # The same scenarios once more under LabChaos (app/src/test/.../mesh/lab/LabChaos.kt): lagged dispatches,
    # jittered pipes and the occasional 40-400 ms single-coroutine stall a one-vCPU runner produces now and
    # then, produced on purpose. A failure is a schedule a slow runner can hit too, so it names a latent
    # flake with its seed (the run id) — reproduce locally with `scripts/lab-chaos.sh --seed <run id>`.
    # Advisory until the findings of the first local sweep (2026-09-24) are triaged; then enforce it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools # NOT the default `tools platform-tools` — see ACTION PINS above
      - uses: gradle/actions/setup-gradle@v5
      - name: Run the mesh/lab scenarios under chaos
        run: >-
          ./gradlew :app:testDebugUnitTest --tests 'app.getknit.knit.mesh.lab.*' --rerun --stacktrace --console=plain
          -Pknit.labChaos=${{ github.run_id }}
      - name: Upload mesh/lab chaos report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mesh-lab-chaos-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  verify:
    name: detekt & ktlint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory, mirroring .gitlab-ci.yml allow_failure; enforced locally by Git hooks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools # NOT the default `tools platform-tools` — see ACTION PINS above
      - uses: gradle/actions/setup-gradle@v5
      - name: detekt
        run: ./gradlew detekt --stacktrace --console=plain
      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace --console=plain

  qodana:
    name: Qodana inspections (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory, like detekt/ktlint above
    # The IntelliJ inspection engine over the whole tree — the only thing here that finds a *global*
    # problem ("this class has no callers", "this resource is referenced by nothing"). Android Lint,
    # detekt and ktlint are different engines and do not overlap with it; scripts/ide-diagnostics.sh
    # reaches the same engine but one focused file at a time, so it cannot see across the project.
    # The linter pin, profile and exclude list live in qodana.yaml.
    #
    # This is the job that actually runs on every push: hosted runners are 4 vCPU / 16 GB, whereas
    # the internal GitLab runner is 1 vCPU / 2 GB and would OOM, so verify:qodana there is manual.
    permissions:
      contents: read
      pull-requests: write # post-pr-comment
      checks: write # use-annotations
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Qodana reads history to attribute findings to commits
      - uses: JetBrains/qodana-action@v2026.2.1
        with:
          # pr-mode analyses ONLY the files a PR touched, which silently disables exactly the
          # whole-project inspections this job exists for — an unused class stops looking unused once
          # you stop looking at its callers. Full scan every time.
          pr-mode: false
          # The action caches its whole cache-dir, and restoring the IDE's project state from it
          # silently drops the Android facets — the run exits 0 with every AndroidLint inspection
          # reporting nothing (measured: 38 -> 0, no warning). Correct-but-slower beats
          # quietly-wrong, so the cache is off; the bootstrap re-fetches the SDK and JDK each run.
          use-caches: false
          upload-result: true
          # --baseline holds the committed qodana.sarif.json, so the run reports what is NEW rather
          # than re-reporting the accepted backlog (which includes the @Preview blind spot the
          # AGP forward-compat property leaves behind — see qodana.yaml's banner).
          args: --save-report --baseline qodana.sarif.json
        env:
          # qodana.yaml's bootstrap installs compileSdk 37.1 + build-tools here — the linter image
          # ships only android-33, and without the matching platform every Android API resolves to
          # nothing, so the run reports garbage rather than reporting nothing.
          ANDROID_SDK_ROOT: ${{ runner.temp }}/qodana/caches/android-sdk
          ANDROID_HOME: ${{ runner.temp }}/qodana/caches/android-sdk
          # Optional: unset is fine. The Community linter qodana.yaml pins needs no licence; a token
          # only publishes the run to Qodana Cloud for trend history and baselines.
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  adr-index:
    name: ADR router is in sync
    runs-on: ubuntu-latest
    # No JDK, no Android SDK, no Gradle: this only reads `.agents/memory/decisions/`.
    # Enforced (not advisory) because a stale router silently hides a decision from
    # every agent that reads it, and `merge=union` on the generated file means a bad
    # merge lands quietly rather than as a conflict.
    steps:
      - uses: actions/checkout@v7
      - name: Check .agents/memory/decisions.md
        run: python3 scripts/adr.py index --check

  generated-assets:
    name: Generated assets are in sync
    runs-on: ubuntu-latest
    # No JDK, no Android SDK, no Gradle: the emoji catalog is a committed file generated from a vendored
    # Unicode source, so a hand edit or a re-vendor without a regenerate must fail here, not on a device.
    steps:
      - uses: actions/checkout@v7
      - name: Generator unit tests
        run: python3 -m unittest scripts/test_gen_emoji_catalog.py
      - name: Check app/src/main/assets/emoji/emoji_en.tsv
        run: python3 scripts/gen-emoji-catalog.py --check
