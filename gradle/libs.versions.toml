androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# ATF (Accessibility Test Framework) checks in Compose UI tests — the same framework the Play pre-launch
# report runs. BOM-governed like the other compose-ui test artifacts. See app.getknit.knit.a11y.
androidx-compose-ui-test-junit4-accessibility = { group = "androidx.compose.ui", name = "ui-test-junit4-accessibility" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
androidx-room-testing = { group = "androidx.room3", name = "room3-testing", version.ref = "room3" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

# JVM Room/DAO + migration test deps (finding #5) — see the [versions] notes above.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
# `@PreviewTest` for the screenshot-test source set — see the composeScreenshot version note above.
compose-screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "composeScreenshot" }
# Instrumentation runner/rules (promote the transitive runner to explicit; rules gives GrantPermissionRule
# / ActivityScenario helpers) + the Orchestrator and its test-services APK (androidTestUtil). See the
# version notes above.
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestCore" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestCore" }
androidx-test-orchestrator = { group = "androidx.test", name = "orchestrator", version.ref = "androidxTestOrchestrator" }
androidx-test-services = { group = "androidx.test.services", name = "test-services", version.ref = "androidxTestServices" }
# Scoped-storage-safe test output (TestStorage) — how screenshots reach Firebase Test Lab's collected
# per-device outputs without WRITE_EXTERNAL_STORAGE on any API level (the doc's no-permission promise, kept
# on the emulator too — unlike testlab-instr-lib, which hardcodes a /sdcard write only FTL's env grants).
androidx-test-services-storage = { group = "androidx.test.services", name = "storage", version.ref = "androidxTestServices" }
# UIAutomator black-box driver (androidTest-only; app.getknit.knit.uiauto suite). See the version note above.
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Test-only: a local HTTP server for OkHttpPreviewFetcherTest — the byte caps, redirect policy and header
# hygiene of the link-preview fetch are only observable on a socket. Same version line as okhttp, never ships.
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }

