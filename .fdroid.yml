# In-repo F-Droid metadata. Two jobs:
#   1. Lets `fdroid build` build Knit straight from a checkout, so the buildserver recipe can be tested
#      locally in F-Droid's own container before anything is submitted.
#   2. Source of truth for `metadata/app.getknit.knit.yml` in fdroiddata — edit here, copy there.
# Comments are the ONLY permitted difference: fdroidserver's canonical writer strips them, so everything
# else must match the merged fdroiddata file field-for-field, in this order, or the two have drifted. They
# did once — the new-app review (MR 43609) dropped an AntiFeatures block, MaintainerNotes and every
# `output:` line, and reordered fields, none of which was mirrored back here until 2.2.3. Check with:
#   diff <(grep -v '^\s*#' .fdroid.yml | grep -v '^$') <(grep -v '^$' ../fdroiddata/metadata/app.getknit.knit.yml)
# Field reference: https://f-droid.org/docs/Build_Metadata_Reference/
# Background and the reproducibility contract: .agents/context/distribution.md
#
# NOTE: a local `fdroid build` needs JDK 21 already present — settings.gradle.kts omits the foojay resolver,
# so Gradle won't fetch one (it fails loudly). The F-Droid buildserver already has JDK 21 selected.

# Validated against fdroiddata's config/categories.yml (108 categories — the old ~17-category list is long
# gone). Deliberately NOT "Internet": Knit works without it, and filing an offline mesh messenger under
# Internet misdescribes it. `fdroid lint` will reject any name not in that file. Alphabetical, as the
# canonical writer emits them.
Categories:
  - Connectivity
  - Messaging
  - Security
License: GPL-3.0-or-later
AuthorName: Jeffrey Walter Mixon
WebSite: https://github.com/getknit/knit
SourceCode: https://github.com/getknit/knit
IssueTracker: https://github.com/getknit/knit/issues
Changelog: https://github.com/getknit/knit/releases
# One free-form URL is all the schema allows, so GitHub Sponsors (github.com/sponsors/getknit) has no
# field here; the in-app Support screen and the store description list it.
Donate: https://ko-fi.com/knit
# Bare user/group name, not a URL — F-Droid builds the link itself. Field order matters to
# fdroidserver's canonical writer: Liberapay goes directly after Donate.
Liberapay: zaventh

AutoName: Knit

RepoType: git
Repo: https://github.com/getknit/knit.git
# Reproducible-build flow: F-Droid rebuilds the tagged commit, byte-compares against the APK below, and on
# a match distributes OUR signed APK rather than re-signing with F-Droid's key. See distribution.md for why
# that matters here (Knit's offline app-share hands peers this same APK).
Binaries: https://github.com/getknit/knit/releases/download/v%v/knit-%v.apk

# No AntiFeatures block, and no `output:` or `ndk:` lines. On-device content moderation runs Google's
# prebuilt TensorFlow Lite (com.google.ai.edge.litert), which the source scanner used to flag via the SUSS
# signature `litert:(2|1.[34])` — an over-broad false positive on the published 1.x line, which is the plain
# org.tensorflow.lite interpreter (Apache-2.0, zero Play refs). The real Play coupling (AiPackModelProvider
# + com.google.android.play:ai-delivery) publishes as litert-api:2.x. Fixed upstream in fdroid-suss!63
# (signature -> `litert(-api)?:2`, merged 2026-07-26), after which our pinned litert:1.4.2 stopped matching
# and the NonFreeDep AntiFeature was dropped in review. Keep Google's litert: the from-source substitute
# de.schliweb:tensorflow-lite-fdroid miscomputes our Detoxify/ALBERT model (saturates every output to 0/1
# on-device, independent of the XNNPACK delegate), so it would make Knit block every message — full
# evidence in distribution.md. `output:` is unnecessary because fdroidserver finds the APK itself, and the
# APK path needs no NDK (native-symbol extraction defaults on only for `bundle*` tasks, i.e. the Play AAB).
# `commit:` is the full 40-char hash, not the tag — the reviewer's request, since tags are mutable. Oldest
# build first, as the canonical writer emits them.
Builds:
