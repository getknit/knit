# Reviewer personas the Stop hook (review-gate.sh) asks for. One reviewer per line, five tab-separated fields:
#
#   name       the agent (`.claude/agents/<name>.md`, a symlink into `.agents/personas/`)
#   stage      1 for a subsystem reviewer, 2 for a test reviewer: stage 2 is asked for only once no stage-1 review is
#              pending (.agents/rules/review-rounds.md, section 2)
#   follow-up  how many diff lines past the reviewer's last stamp still count as applying its findings
#   paths      space-separated git pathspecs; an uncommitted change under any of them owes a review
#   relay      what the caller hands the user from the report, besides the findings
#
# A new reviewer is a persona, its symlink, a line here and a routing bullet in AGENTS.md. CI reads this map too
# (`review-gate.sh --owed`, .github/workflows/review-gates*.yml); a reviewer whose persona runs checks also gets
# them in scripts/review-checks.sh, which runs them for a pull request.
